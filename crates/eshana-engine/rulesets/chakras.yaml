  - [Krittika, Shravana]
  - [Rohini, Abhijit]
  - [Mrigashira, Uttara Ashadha]
  - [Ardra, Purva Ashadha]
  - [Punarvasu, Mula]
  - [Pushya, Jyeshtha]
  - [Ashlesha, Anuradha]
  - [Magha, Bharani]
  - [Purva Phalguni, Ashwini]
  - [Uttara Phalguni, Revati]
  - [Hasta, Uttara Bhadrapada]
  - [Chitra, Purva Bhadrapada]
  - [Swati, Shatabhisha]
  - [Vishakha, Dhanishta]
