name: security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly Monday 03:00 UTC

permissions:
  contents: read

jobs:
  supply-chain:
    name: cargo deny + cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the tools
        run: cargo install --locked cargo-deny cargo-audit

      - name: Licences, advisories, bans, sources (deny.toml)
        run: cargo deny check

      - name: RustSec advisories for Cargo.lock
        run: cargo audit

  dist-scan:
    name: build the wheel and scan it the way package firewalls do
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"
          enable-cache: false

      - name: Build and scan
        run: |
          make install
          make wheel
          uv run --no-project python scripts/scan_dist.py --dist dist --out scan-report

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scan-report
          path: scan-report/
