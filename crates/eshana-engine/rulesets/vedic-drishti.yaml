# Rule pack: vedic.drishti@0.1 (split from vedic.core 0.3; values unchanged). Values follow Brihat Parashara Hora Shastra
# (BPHS) as commonly taught; where schools differ the convention is named.
id: vedic.drishti
version: "0.1"
conventions:
  node_aspects: "Rahu and Ketu aspect the 5th, 7th and 9th from their sign (a common convention; some schools use the 7th only)"
  additional_aspects: "Optional, shown only on request: a retrograde graha (not the nodes) also casts graha and rasi drishti from the sign before it (its shadow); two grahas in parivartana (each in the other's sign) cast their aspects from the exchanged signs"
  outer_aspects: "Uranus, Neptune and Pluto, where shown, aspect the 5th, 7th and 9th from their sign (a modern convention, by analogy with the nodes; classical texts do not use the outer planets)"

# Graha drishti: every graha aspects the 7th; these add special aspects (houses counted from the graha's sign).
drishti:
  all: [7]
  special:
    mars: [4, 8]
    jupiter: [5, 9]
    saturn: [3, 10]
    rahu: [5, 9]
    ketu: [5, 9]
    uranus: [5, 9]
    neptune: [5, 9]
    pluto: [5, 9]

