# What ESHANA must be able to do before a release, and how much of the CLI the scenarios exercise.
# Scenarios prove capabilities by tagging themselves @cap_<id> (dots and dashes become underscores).
# blocker: true -> a failing or unproven capability BLOCKs the release; the rest hold it at CONDITIONAL.
product: ESHANA
default_fixture: default
binaries: [eshana, eshana-report]
surface_target: 0.9

capabilities:
  - { id: packaging, title: "Installs cleanly: the eshana binary starts fast, reports the release version, and the Python wheel imports", dimension: release, blocker: true }
  - { id: positions, title: "Apparent geocentric positions for ten bodies and the node, with speed and retrograde state", dimension: core, blocker: true }
  - { id: civil-time, title: "IANA civil time: DST folds and gaps are errors with distinct codes unless a fold policy is given", dimension: core, blocker: true }
  - { id: config-discipline, title: "Tropical vs sidereal is never merged; an ayanamsha is never chosen silently; defaults are recorded", dimension: core, blocker: true }
  - { id: vedic, title: "Vedic chart: rashi, nakshatra and pada, whole-sign bhava, divisional charts, Vimshottari dasha, each naming its rule", dimension: core, blocker: true }
  - { id: western, title: "Western chart: houses, Ptolemaic aspects with orb and applying state; polar Placidus is refused, not extrapolated", dimension: core, blocker: true }
  - { id: human-design, title: "Human Design: design instant is the 88-degree solar arc, 13 activations per side, derived type and authority, exact time required", dimension: core, blocker: true }
  - { id: numerology, title: "Numerology under a named school, with normalisation reported and schools never merged", dimension: core, blocker: true }
  - { id: uncertain-time, title: "An unknown or approximate birth time gives intervals and flags; the Ascendant and houses are never invented", dimension: safety, blocker: true }
  - { id: compare, title: "Method comparison explains differences as configuration, not defects", dimension: core, blocker: true }
  - { id: graph, title: "Symbolic graph exports (json, mermaid, graphml) with relation classes; no causal edges", dimension: core, blocker: true }
  - { id: provenance, title: "Every result carries engine, provider, tzdb, rule versions and assumptions; interpretations stay empty; derived values name their rule", dimension: governance, blocker: true }
  - { id: determinism, title: "The same request returns the same bytes, twice and across processes", dimension: reliability, blocker: true }
  - { id: errors, title: "Errors are clean envelopes with stable ESH-* codes; refusals exit 2; explain knows every code", dimension: usability, blocker: true }
  - { id: python-parity, title: "The Python facade and the CLI return the same JSON", dimension: interop, blocker: true }
  - { id: privacy, title: "Computation is local: no files written, no network needed, birth data not echoed outside the result", dimension: privacy, blocker: true }
  - { id: report, title: "eshana-report writes one self-contained HTML file with every chart; unknown inputs are listed as not computed, never guessed", dimension: usability, blocker: true }
  - { id: schema, title: "Results validate against the published JSON Schema", dimension: interop, blocker: false }

surface:
  - eshana
  - eshana positions
  - eshana chart
  - eshana human-design
  - eshana numerology
  - eshana compare
  - eshana graph
  - eshana request
  - eshana doctor
  - eshana explain
  - eshana schema
  - eshana-report
