# Chakras rule pack: vedic.chakras@0.1 (Sarvatobhadra with vedha, Kota, Sanghatta).
#
# Sources: the Sarvatobhadra and Kota chakras of the Narapati-jayacharya-svarodaya tradition as printed in modern
# manuals of transit (gochara) and prashna work; the Sanghatta vedha pairs are the sapta-shalaka (seven-line) vedha
# pairs of the muhurta texts (Muhurta-chintamani, vivaha section). The layout of every chakra was checked against a
# published reference chart (the Sri Ramana Maharshi chart printed by a well-known program).
#
# Conventions chosen here (each one is reported in the attribute value too):
# - 28 nakshatras: the 27 equal nakshatras plus Abhijit, which takes the last pada of Uttara Ashadha and the first
#   fifteenth of Shravana (276 deg 40 min to 280 deg 53 min 20 sec sidereal). A body in that span sits in Abhijit.
# - Sarvatobhadra orientation: east at the top, south on the right, west at the bottom, north on the left (as the
#   reference prints it). Vowels in the corners of the four rings run clockwise from the north-east (top-left).
# - Vedha lines: from its nakshatra cell every graha pierces three lines: front (sammukha, straight across the grid),
#   left (vama) and right (dakshina) diagonals; left and right are the left and right hand of an observer standing in
#   the nakshatra cell and facing the centre. The emphasised line follows motion: vakri (retrograde) grahas look right,
#   shighra (faster than their mean motion) grahas look left, the rest look to the front; Rahu and Ketu are always
#   counted vakri and the Sun and Moon always look to the front.
# - Kota: four concentric zones (stambha, madhya, prakara, bahya); seven nakshatras per direction counted from the
#   Janma nakshatra (the Moon nakshatra) in the east; each direction enters from its corner (bahya, prakara, madhya),
#   reaches the stambha and leaves along the axis (madhya, prakara, bahya). Kota swami: lord of the Moon sign. Kota
#   pala: lord of the navamsha (pada) occupied by the Moon.

abhijit: [276.6666666666667, 280.8888888888889]

nakshatras:
  - [Ashwini, "अश्विनी", "Aśvinī"]
  - [Bharani, "भरणी", "Bharaṇī"]
  - [Krittika, "कृत्तिका", "Kṛttikā"]
  - [Rohini, "रोहिणी", "Rohiṇī"]
  - [Mrigashira, "मृगशिरा", "Mṛgaśirā"]
  - [Ardra, "आर्द्रा", "Ārdrā"]
  - [Punarvasu, "पुनर्वसु", "Punarvasu"]
  - [Pushya, "पुष्य", "Puṣya"]
  - [Ashlesha, "आश्लेषा", "Āśleṣā"]
  - [Magha, "मघा", "Maghā"]
  - [Purva Phalguni, "पूर्वफाल्गुनी", "Pūrvaphalgunī"]
  - [Uttara Phalguni, "उत्तरफाल्गुनी", "Uttaraphalgunī"]
  - [Hasta, "हस्त", "Hasta"]
  - [Chitra, "चित्रा", "Citrā"]
  - [Swati, "स्वाती", "Svātī"]
  - [Vishakha, "विशाखा", "Viśākhā"]
  - [Anuradha, "अनुराधा", "Anurādhā"]
  - [Jyeshtha, "ज्येष्ठा", "Jyeṣṭhā"]
  - [Mula, "मूल", "Mūla"]
  - [Purva Ashadha, "पूर्वाषाढा", "Pūrvāṣāḍhā"]
  - [Uttara Ashadha, "उत्तराषाढा", "Uttarāṣāḍhā"]
  - [Abhijit, "अभिजित्", "Abhijit"]
  - [Shravana, "श्रवण", "Śravaṇa"]
  - [Dhanishta, "धनिष्ठा", "Dhaniṣṭhā"]
  - [Shatabhisha, "शतभिषा", "Śatabhiṣā"]
  - [Purva Bhadrapada, "पूर्वभाद्रपदा", "Pūrvabhādrapadā"]
  - [Uttara Bhadrapada, "उत्तरभाद्रपदा", "Uttarabhādrapadā"]
  - [Revati, "रेवती", "Revatī"]

# The pada syllables (nāmākṣara, the "avakahaḍā" table): the sound of each of the four padas of every nakshatra, in
# the order of the nakshatras above, as [Devanagari, transliteration]. Source: the nāmākṣara table printed in modern
# pañcāṅgas and muhūrta manuals (it goes back to the nakshatra chapter of the muhūrta texts); in the 28-nakshatra form
# used by the Sarvatobhadra, Abhijit takes जू जे जो ख. Short-a syllables are written as the published reference chart
# prints them (व, क, ह, ड, ...); some tables write the same sounds long (वा, का, ...). Each of the twenty letters
# (varṇa) of the second ring except अ is one of these syllables, which the tests check.
pada_syllables:
  - [["चु", "cu"], ["चे", "ce"], ["चो", "co"], ["ल", "la"]]  # Ashwini
  - [["ली", "lī"], ["लू", "lū"], ["ले", "le"], ["लो", "lo"]]  # Bharani
  - [["अ", "a"], ["इ", "i"], ["उ", "u"], ["ए", "e"]]  # Krittika
  - [["ओ", "o"], ["व", "va"], ["वी", "vī"], ["वू", "vū"]]  # Rohini
  - [["वे", "ve"], ["वो", "vo"], ["क", "ka"], ["की", "kī"]]  # Mrigashira
  - [["कु", "ku"], ["घ", "gha"], ["ङ", "ṅa"], ["छ", "cha"]]  # Ardra
  - [["के", "ke"], ["को", "ko"], ["ह", "ha"], ["ही", "hī"]]  # Punarvasu
  - [["हु", "hu"], ["हे", "he"], ["हो", "ho"], ["ड", "ḍa"]]  # Pushya
  - [["डी", "ḍī"], ["डू", "ḍū"], ["डे", "ḍe"], ["डो", "ḍo"]]  # Ashlesha
  - [["म", "ma"], ["मी", "mī"], ["मू", "mū"], ["मे", "me"]]  # Magha
  - [["मो", "mo"], ["ट", "ṭa"], ["टी", "ṭī"], ["टू", "ṭū"]]  # Purva Phalguni
  - [["टे", "ṭe"], ["टो", "ṭo"], ["प", "pa"], ["पी", "pī"]]  # Uttara Phalguni
  - [["पू", "pū"], ["ष", "ṣa"], ["ण", "ṇa"], ["ठ", "ṭha"]]  # Hasta
  - [["पे", "pe"], ["पो", "po"], ["र", "ra"], ["री", "rī"]]  # Chitra
  - [["रू", "rū"], ["रे", "re"], ["रो", "ro"], ["त", "ta"]]  # Swati
  - [["ती", "tī"], ["तू", "tū"], ["ते", "te"], ["तो", "to"]]  # Vishakha
  - [["न", "na"], ["नी", "nī"], ["नू", "nū"], ["ने", "ne"]]  # Anuradha
  - [["नो", "no"], ["य", "ya"], ["यी", "yī"], ["यू", "yū"]]  # Jyeshtha
  - [["ये", "ye"], ["यो", "yo"], ["भ", "bha"], ["भी", "bhī"]]  # Mula
  - [["भू", "bhū"], ["ध", "dha"], ["फ", "pha"], ["ढ", "ḍha"]]  # Purva Ashadha
  - [["भे", "bhe"], ["भो", "bho"], ["ज", "ja"], ["जी", "jī"]]  # Uttara Ashadha
  - [["जू", "jū"], ["जे", "je"], ["जो", "jo"], ["ख", "kha"]]  # Abhijit
  - [["खी", "khī"], ["खू", "khū"], ["खे", "khe"], ["खो", "kho"]]  # Shravana
  - [["ग", "ga"], ["गी", "gī"], ["गू", "gū"], ["गे", "ge"]]  # Dhanishta
  - [["गो", "go"], ["स", "sa"], ["सी", "sī"], ["सू", "sū"]]  # Shatabhisha
  - [["से", "se"], ["सो", "so"], ["द", "da"], ["दी", "dī"]]  # Purva Bhadrapada
  - [["दू", "dū"], ["थ", "tha"], ["झ", "jha"], ["ञ", "ña"]]  # Uttara Bhadrapada
  - [["दे", "de"], ["दो", "do"], ["च", "ca"], ["ची", "cī"]]  # Revati

