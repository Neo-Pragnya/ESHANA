name: acceptance

# The release gate: capability scenarios against the real binary, then against the built wheel.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"
          enable-cache: false

      - name: Capability acceptance on the dev build
        run: |
          make install
          make acceptance

      - name: Capability acceptance on the built wheel (what ships)
        run: make acceptance-wheel

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: acceptance-report
          path: acceptance/report/

  browser:
    # Real Chrome (preinstalled on the runner) drives the chart studio and the website.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Studio journeys (generated chart app)
        run: |
          make install
          make studio-journeys JOURNEY_SHOTS=target/journey-shots

      - name: Site journeys (built website)
        env:
          SITE_BASE: /ESHANA/
        run: |
          (cd website && npm ci && npm run build)
          make site-journeys JOURNEY_SHOTS=target/journey-shots

      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: journey-screenshots
          path: target/journey-shots/
