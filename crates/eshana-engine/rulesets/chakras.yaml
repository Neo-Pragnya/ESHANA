# the five tithi groups and the weekdays (0 = Sunday) that share their cell
tithi_groups:
  - {name: Nanda, dev: "नन्दा", tr: "Nandā", tithis: [1, 6, 11], weekdays: [0, 2]}
  - {name: Bhadra, dev: "भद्रा", tr: "Bhadrā", tithis: [2, 7, 12], weekdays: [1, 3]}
  - {name: Jaya, dev: "जया", tr: "Jayā", tithis: [3, 8, 13], weekdays: [4]}
  - {name: Rikta, dev: "रिक्ता", tr: "Riktā", tithis: [4, 9, 14], weekdays: [5]}
  - {name: Purna, dev: "पूर्णा", tr: "Pūrṇā", tithis: [5, 10, 15], weekdays: [6]}

# The 9 x 9 Sarvatobhadra grid, top row first (east at the top). Codes: n = nakshatra (index in the 28 above),
# v = vowel, l = letter, r = rashi, t = tithi group.
sarvatobhadra:
  - [v0, n2, n3, n4, n5, n6, n7, n8, v1]
  - [n1, v4, l0, l1, l2, l3, l4, v5, n9]
  - [n0, l19, v8, r1, r2, r3, v9, l5, n10]
  - [n27, l18, r0, v12, t0, v13, r4, l6, n11]
  - [n26, l17, r11, t3, t4, t1, r5, l7, n12]
  - [n25, l16, r10, v15, t2, v14, r6, l8, n13]
  - [n24, l15, v11, r9, r8, r7, v10, l9, n14]
  - [n23, v7, l14, l13, l12, l11, l10, v6, n15]
  - [v3, n22, n21, n20, n19, n18, n17, n16, v2]

# mean daily motion (deg per day), for the shighra test
mean_motion: {sun: 0.9856, moon: 13.1764, mars: 0.5240, mercury: 0.9856, jupiter: 0.0831, venus: 0.9856, saturn: 0.0335}

kota:
  zones: [bahya, prakara, madhya, stambha, madhya, prakara, bahya]
  directions: [east, south, west, north]
  # zone half-sizes for drawing (bahya = 1)
  size: {bahya: 1.0, prakara: 0.75, madhya: 0.5, stambha: 0.25}

# Sanghatta: the sapta-shalaka vedha pairs (seven vertical and seven horizontal lines; the two nakshatras at the ends
# of one line pierce each other). Names as in the 28 above.
