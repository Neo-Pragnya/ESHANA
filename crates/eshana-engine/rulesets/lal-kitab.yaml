# Rule pack: vedic.lal_kitab@0.1 (LK-01). DRAFT: the pakka ghar table is the one commonly taught from the Lal Kitab
# (1952 edition); editions and teachers differ, and it awaits review by the project owner (planning/OWNER-INPUTS.md).
# The Lal Kitab chart itself is well defined: the houses are fixed to the signs (house 1 = Aries … house 12 = Pisces)
# and each graha stands in the house it occupies in the birth chart, counted whole-sign from the lagna.
# Not implemented (no reviewed source here): Lal Kitab aspects, sleeping houses, the varshphal age table, remedies.
id: vedic.lal_kitab
version: "0.1"
status: draft
# Pakka ghar (permanent house) of each graha.
pakka_ghar:
  sun: [1]
  jupiter: [2, 5, 9, 11, 12]
  mars: [3, 8]
  moon: [4]
  ketu: [6]
  venus: [7]
  mercury: [7]
  saturn: [8, 10]
  rahu: [12]
