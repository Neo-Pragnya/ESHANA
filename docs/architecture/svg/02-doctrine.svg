<g class="av-02-doctrine">
<rect x="0" y="0" width="1933" height="628" fill="#FFFFFF"/>
<text x="36" y="44" font-size="22" font-weight="700">Compute, Derive, Interpret: the engine stops after Derive</text>
<text x="36" y="68" font-size="13" fill="#5F6B7A">Each value carries an epistemic label. Interpretation is a separate, opt-in layer that ESHANA does not ship.</text>
<g class="cap"><rect x="36" y="82" width="1399" height="32" rx="7" fill="#232F3E"/>
<rect x="36" y="110" width="0" height="4" rx="2" fill="#FF9900"><animate attributeName="width" values="0;1399" dur="9.60s" repeatCount="indefinite"/></rect>
<text x="48" y="103" font-size="13" font-weight="700" style="fill:#FF9900">▶ NOW</text>
<text x="108" y="103" font-size="13.5" opacity="0">1 · Computed numbers feed the tradition rules; the rule version travels with every result<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0100;0.2400;0.2500;1" dur="9.60s" begin="0.00s" repeatCount="indefinite"/></text>
<text x="108" y="103" font-size="13.5" opacity="0">2 · The engine does not cross this line: interpretations is always an empty list<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0100;0.2400;0.2500;1" dur="9.60s" begin="2.40s" repeatCount="indefinite"/></text>
<text x="108" y="103" font-size="13.5" opacity="0">3 · Anything beyond the line is yours, and has to say what kind of claim it is<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0100;0.2400;0.2500;1" dur="9.60s" begin="4.80s" repeatCount="indefinite"/></text>
<text x="108" y="103" font-size="13.5" opacity="0">4 · When the input cannot support an answer, ESHANA refuses with a stable ESH- error code<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0100;0.2400;0.2500;1" dur="9.60s" begin="7.20s" repeatCount="indefinite"/></text>
</g>
