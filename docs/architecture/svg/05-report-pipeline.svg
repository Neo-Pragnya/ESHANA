<text x="108" y="103" font-size="13.5" opacity="0">1 · The same request object is used for every system you ask for<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0100;0.2400;0.2500;1" dur="9.60s" begin="0.00s" repeatCount="indefinite"/></text>
<text x="108" y="103" font-size="13.5" opacity="0">2 · Envelopes go to the renderer unchanged<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0100;0.2400;0.2500;1" dur="9.60s" begin="2.40s" repeatCount="indefinite"/></text>
<text x="108" y="103" font-size="13.5" opacity="0">3 · One file out: no network, no fonts to fetch, safe to email or archive<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0100;0.2400;0.2500;1" dur="9.60s" begin="4.80s" repeatCount="indefinite"/></text>
<text x="108" y="103" font-size="13.5" opacity="0">4 · You pick sections and theme; a section with no data is omitted, not faked<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0100;0.2400;0.2500;1" dur="9.60s" begin="7.20s" repeatCount="indefinite"/></text>
